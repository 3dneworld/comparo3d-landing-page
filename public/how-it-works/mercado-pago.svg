<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40" role="img" aria-label="Mercado Pago">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#009EE3"/>
      <stop offset="100%" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="180" height="40" rx="8" fill="#ffffff"/>

  <!-- MP circle mark -->
  <circle cx="22" cy="20" r="14" fill="url(#mp-bg)"/>
  <!-- M letter inside circle -->
  <text x="22" y="25" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="15" fill="#ffffff" letter-spacing="-0.5">MP</text>

  <!-- Wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#009EE3">
    <text x="44" y="17" font-size="11" font-weight="700" letter-spacing="-0.2">mercado</text>
    <text x="44" y="30" font-size="11" font-weight="700" letter-spacing="-0.2">pago</text>
  </g>
</svg>
